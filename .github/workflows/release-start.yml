# =====================================================================
# Ouverture d'une release (manuel, depuis l'onglet Actions)
# 1. Calcule la prochaine version semver à partir des Conventional Commits
# 2. Crée la branche release/x.y.z et met à jour le CHANGELOG
# 3. Ouvre la PR release/x.y.z -> main
#
# Le push est fait avec le token de la GitHub App : un push fait avec le
# GITHUB_TOKEN ne déclencherait PAS le workflow release.yml (protection
# anti-boucle de GitHub).
# =====================================================================
name: Release - Ouvrir une release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  open-release:
    name: Créer release/x.y.z
    runs-on: ubuntu-24.04
    steps:
      - name: Token de la GitHub App
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0        # git-cliff lit tout l'historique et les tags
          token: ${{ steps.app.outputs.token }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Installer git-cliff
        run: pip install git-cliff==2.14.2

      - name: Calculer la version
        id: version
        run: |
          NEXT=$(git cliff --bumped-version)
          LAST=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "aucune")
          echo "Dernière version : ${LAST} -> prochaine : ${NEXT}"
          if [ "${NEXT}" = "${LAST}" ]; then
            echo "::error::Aucun commit feat/fix depuis ${LAST} : rien à livrer."
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "release/${NEXT#v}" >/dev/null; then
            echo "::error::La branche release/${NEXT#v} existe déjà."
            exit 1
          fi
          echo "tag=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "branch=release/${NEXT#v}" >> "$GITHUB_OUTPUT"

      - name: Créer la branche et le CHANGELOG
        env:
          TAG: ${{ steps.version.outputs.tag }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          git config user.name "cocktail-bot[bot]"
          git config user.email "cocktail-bot[bot]@users.noreply.github.com"
          git switch -c "${BRANCH}"
          git cliff --tag "${TAG}" -o CHANGELOG.md
          git add CHANGELOG.md
          git commit -m "chore(release): prépare ${TAG}"
          git push origin "${BRANCH}"

      - name: Ouvrir la PR vers main
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ steps.version.outputs.tag }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          {
            echo "## Release ${TAG}"
            echo
            echo "Le push de cette branche déploie automatiquement le **staging** et lance le **DAST**."
            echo "Le merge de cette PR déclenche la promotion en **production** (approbation requise)."
            echo
            git cliff --unreleased --tag "${TAG}" --strip all
          } > pr-body.md
          gh pr create --base main --head "${BRANCH}" --title "release: ${TAG}" --body-file pr-body.md
