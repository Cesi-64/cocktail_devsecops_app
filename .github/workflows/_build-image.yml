# =====================================================================
# Workflow réutilisable : construit, scanne, publie et signe UNE image.
# Build once -> Scan -> (Push) -> SBOM -> Signature.
# L'image n'est poussée dans GHCR que si le scan Trivy est passé.
# =====================================================================
name: _build-image (réutilisable)

on:
  workflow_call:
    inputs:
      component:
        description: backend ou frontend (= dossier de build)
        required: true
        type: string
    outputs:
      image:
        description: Référence immuable de l'image (nom@sha256:...)
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: Digest sha256 de l'image
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.component }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write          # push vers GHCR
      id-token: write          # signature Cosign "keyless" (OIDC)
      security-events: write   # rapport Trivy dans l'onglet Security
    outputs:
      image: ${{ steps.push.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Noms et tags
        id: meta
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          echo "image=ghcr.io/${OWNER}/${REPO,,}/${COMPONENT}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Connexion à GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (chargé localement, PAS encore poussé)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.component }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=cocktail-${{ inputs.component }}
          cache-from: type=gha,scope=${{ inputs.component }}
          cache-to: type=gha,mode=max,scope=${{ inputs.component }}

      - name: Trivy - rapport SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          format: sarif
          output: trivy-${{ inputs.component }}.sarif
          exit-code: '0'

      - name: Publier le rapport dans GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy-${{ inputs.component }}.sarif
          category: trivy-image-${{ inputs.component }}

      - name: Trivy - bloquer sur CRITICAL / HIGH corrigeables
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          format: table
          exit-code: '1'
          skip-setup-trivy: true

      - name: Push vers GHCR (seulement si le scan est passé)
        id: push
        env:
          REF: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          docker push "${REF}"
          DIGEST=$(docker buildx imagetools inspect "${REF}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "### ${{ inputs.component }} : \`${IMAGE}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: SBOM CycloneDX
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.push.outputs.image }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: cyclonedx-json
          output-file: sbom-${{ inputs.component }}.cdx.json
          artifact-name: sbom-${{ inputs.component }}.cdx.json

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Signer l'image et attester le SBOM (Sigstore, sans clé)
        env:
          IMAGE: ${{ steps.push.outputs.image }}
        run: |
          cosign sign --yes "${IMAGE}"
          cosign attest --yes --type cyclonedx --predicate "sbom-${{ inputs.component }}.cdx.json" "${IMAGE}"
