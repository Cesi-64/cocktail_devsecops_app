# =====================================================================
# CodeQL : SAST sémantique de GitHub (JavaScript + workflows Actions)
# Résultats dans l'onglet Security > Code scanning.
# =====================================================================
name: CodeQL

on:
  pull_request:
    branches: [develop, main, 'release/**']
  push:
    branches: [develop, main]
  schedule:
    - cron: '30 4 * * 1'   # chaque lundi : nouvelles règles = nouvelles détections

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
