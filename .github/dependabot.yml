# Dependabot : mises à jour hebdomadaires, le lundi à 6h (heure de Paris).
# Les PR ciblent develop et passent par la CI comme n'importe quelle feature.
version: 2
updates:
- package-ecosystem: npm
  directory: /backend
  target-branch: develop
  schedule:
    interval: weekly
    day: monday
    time: "06:00"
    timezone: Europe/Paris
  commit-message:
    prefix: fix(deps)
    prefix-development: chore(deps)
  labels:
  - dependencies
  - backend
  groups:
    backend-minor-patch:
      update-types:
      - minor
      - patch
- package-ecosystem: npm
  directory: /frontend
  target-branch: develop
  schedule:
    interval: weekly
    day: monday
    time: "06:00"
    timezone: Europe/Paris
  commit-message:
    prefix: fix(deps)
    prefix-development: chore(deps)
  labels:
  - dependencies
  - frontend
  groups:
    frontend-minor-patch:
      update-types:
      - minor
      - patch
- package-ecosystem: npm
  directory: /
  target-branch: develop
  schedule:
    interval: weekly
    day: monday
    time: "06:00"
    timezone: Europe/Paris
  commit-message:
    prefix: chore(deps)
  labels:
  - dependencies
  - tooling
- package-ecosystem: docker
  directories:
  - /backend
  - /frontend
  target-branch: develop
  schedule:
    interval: weekly
    day: monday
    time: "06:00"
    timezone: Europe/Paris
  commit-message:
    prefix: fix(docker)
  labels:
  - dependencies
  - docker
- package-ecosystem: github-actions
  directory: /
  target-branch: develop
  schedule:
    interval: weekly
    day: monday
    time: "06:00"
    timezone: Europe/Paris
  commit-message:
    prefix: ci(deps)
  labels:
  - dependencies
  - ci
  groups:
    actions:
      patterns:
      - '*'
