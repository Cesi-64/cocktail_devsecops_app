# Metadata
sonar.organization=MON-ORGA-SONAR
sonar.projectKey=MON-ORGA-SONAR_cocktail-front

sonar.projectVersion=1.0.0
sonar.projectEncoding=UTF-8


# Source
sonar.sources=src
sonar.tests=cypress/e2e

# Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclude
sonar.exclusions=node_modules/**,cypress/**

# La CI échoue si la Quality Gate SonarCloud n'est pas respectée
sonar.qualitygate.wait=true